<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MongoDB Read/Write Concerns Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F1923;
      color: #D8E8F3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 56px;
      gap: 16px;
    }

    header { text-align: center; }
    h1 { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .subtitle { margin-top: 5px; font-size: 0.85rem; color: #90AEBF; }

    /* ── shared card ── */
    .card {
      width: 100%;
      max-width: 900px;
      background: #182535;
      border: 1px solid #26384A;
      border-radius: 12px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      flex-wrap: wrap;
      padding: 14px 18px;
    }

    .control-group { display: flex; flex-direction: column; gap: 5px; }
    .control-group label { font-size: 0.75rem; color: #90AEBF; text-transform: uppercase; letter-spacing: 0.05em; }

    select, input[type=number] {
      background: #0A1E2B;
      border: 1px solid #26384A;
      color: #D8E8F3;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.87rem;
      min-width: 120px;
      cursor: pointer;
    }
    select:focus, input[type=number]:focus { outline: 2px solid #00ED64; border-color: transparent; }

    .btn-group { display: flex; gap: 6px; }
    button {
      background: #00ED64;
      color: #0F1923;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #00c050; }
    button:disabled { background: #26384A; color: #5a7a8a; cursor: not-allowed; }
    button.secondary {
      background: #1E3446;
      color: #D8E8F3;
      border: 1px solid #26384A;
    }
    button.secondary:hover { background: #26384A; }
    button.secondary.active {
      background: #0A2535;
      border-color: #00ED64;
      color: #00ED64;
    }

    /* ── Step panel ── */
    .step-panel {
      padding: 14px 20px 16px;
      border-top: 1px solid #26384A;
    }
    .step-panel.hidden { display: none; }

    .step-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .step-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #90AEBF;
    }
    .step-dots { display: flex; gap: 5px; }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #26384A;
      transition: background 0.2s;
    }
    .step-dot.done    { background: #00ED64; }
    .step-dot.current { background: #F5A623; }

    .step-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }
    .step-explain {
      font-size: 0.84rem;
      color: #90AEBF;
      line-height: 1.6;
    }
    .step-explain strong { color: #D8E8F3; }

    /* ── Stage ── */
    .stage { padding: 16px; }
    #canvas { display: block; width: 100%; height: 420px; }

    /* ── Log ── */
    .log-panel { padding: 12px 18px; }
    .log-panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #90AEBF; margin-bottom: 8px; }
    #log {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      line-height: 1.65;
      color: #90AEBF;
      min-height: 48px;
      max-height: 130px;
      overflow-y: auto;
    }
    #log .ok   { color: #00ED64; }
    #log .warn { color: #F5A623; }
    #log .err  { color: #FF6B6B; }
    #log .info { color: #7EC8E3; }
  </style>
</head>
<body>

<header>
  <h1>MongoDB Concerns Playground</h1>
  <p class="subtitle">Visualise how read &amp; write concerns shape data flow in a 3-node replica set</p>
</header>

<!-- Controls + Step panel in one card -->
<div class="card">
  <div class="controls">
    <div class="control-group">
      <label>Write concern w</label>
      <select id="sel-w">
        <option value="0">0 — fire &amp; forget</option>
        <option value="1">1 — primary only</option>
        <option value="2">2 — primary + 1 sec</option>
        <option value="3">3 — all nodes</option>
        <option value="majority" selected>majority</option>
      </select>
    </div>
    <div class="control-group">
      <label>Journal (j)</label>
      <select id="sel-j">
        <option value="false" selected>false</option>
        <option value="true">true</option>
      </select>
    </div>
    <div class="control-group">
      <label>wtimeout (ms)</label>
      <input id="inp-wtimeout" type="number" value="0" min="0" step="500" style="min-width:90px" />
    </div>
    <div class="control-group" style="flex:1;min-width:160px;">
      <label>Simulate failure</label>
      <select id="sel-failure">
        <option value="none">None</option>
        <option value="s1down">S1 down</option>
        <option value="s2down">S2 down</option>
        <option value="bothdown">Both secondaries down</option>
        <option value="pdown">Primary down</option>
        <option value="partition">Network partition</option>
      </select>
    </div>
    <div class="control-group">
      <label>Mode</label>
      <div class="btn-group">
        <button class="secondary" id="btn-mode-auto" onclick="setMode('auto')">Auto</button>
        <button class="secondary active" id="btn-mode-step" onclick="setMode('step')">Step by step</button>
      </div>
    </div>
    <div class="btn-group" style="align-self:flex-end;">
      <button id="btn-action" onclick="handleAction()">Start Write</button>
      <button class="secondary" id="btn-next" onclick="advanceStep()" disabled>Next →</button>
    </div>
  </div>

  <!-- Step description panel -->
  <div class="step-panel hidden" id="step-panel">
    <div class="step-meta">
      <span class="step-badge" id="step-badge">Step 1 of 5</span>
      <div class="step-dots" id="step-dots"></div>
    </div>
    <div class="step-title" id="step-title"></div>
    <div class="step-explain" id="step-explain"></div>
  </div>
</div>

<!-- Canvas -->
<div class="card stage">
  <canvas id="canvas"></canvas>
</div>

<!-- Log -->
<div class="card log-panel">
  <h2>Event log</h2>
  <div id="log"></div>
</div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const PARTICLE_MS  = 1400;   // ms for a particle to travel node-to-node
const AUTO_STEP_MS = 700;    // pause between steps in auto mode

// ── MongoDB icons ──────────────────────────────────────────
// MongoDB leaf — simple-icons, viewBox 0 0 24 24
const ICON_LEAF = new Path2D(
  'M17.193 9.555c-1.264-5.58-4.252-7.414-4.573-8.115-.28-.394-.53-.954-.735-1.44' +
  '-.036.495-.055.685-.523 1.184-.723.566-4.438 3.682-4.74 10.02' +
  '-.282 5.912 4.27 9.435 4.888 9.884l.07.05A73.49 73.49 0 0111.91 24h.481' +
  'c.114-1.032.284-2.056.51-3.07.417-.296.604-.463.85-.693' +
  'a11.342 11.342 0 003.639-8.464c.01-.814-.103-1.662-.197-2.218z' +
  'M11.857 17.75s0-8.291.275-8.29c.213 0 .49 10.695.49 10.695-.381-.045-.765-1.76-.765-2.405z'
);

// ReplicaSet topology — LeafyGreen, viewBox 0 0 16 16
const ICON_RS = new Path2D(
  'M9.39072 7.71281C8.96444 7.89758 8.49418 8 8 8C7.50582 8 7.03556 7.89758 6.60928 7.71281' +
  'L5.26491 9.72938C5.719 10.182 6 10.8082 6 11.5C6 12.8807 4.88071 14 3.5 14' +
  'C2.11929 14 1 12.8807 1 11.5C1 10.1193 2.11929 9 3.5 9C3.73768 9 3.96761 9.03317 4.18543 9.09513' +
  'L5.56972 7.01868C4.91019 6.38216 4.5 5.48898 4.5 4.5C4.5 2.567 6.067 1 8 1' +
  'C9.933 1 11.5 2.567 11.5 4.5C11.5 5.48898 11.0898 6.38216 10.4303 7.01868' +
  'L11.8146 9.09513C12.0324 9.03317 12.2623 9 12.5 9C13.8807 9 15 10.1193 15 11.5' +
  'C15 12.8807 13.8807 14 12.5 14C11.1193 14 10 12.8807 10 11.5' +
  'C10 10.8082 10.281 10.182 10.7351 9.72938L9.39072 7.71281Z' +
  'M9.75 4.5C9.75 5.4665 8.9665 6.25 8 6.25C7.0335 6.25 6.25 5.4665 6.25 4.5' +
  'C6.25 3.5335 7.0335 2.75 8 2.75C8.9665 2.75 9.75 3.5335 9.75 4.5Z'
);

// Draw an icon path centered at (cx,cy), scaled to `size` px from its native `viewSize`
function drawIcon(path, cx, cy, size, color, viewSize = 16) {
  const s = size / viewSize;
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.fill(path);
  ctx.restore();
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const state = {
  nodes: {
    primary: { label: 'Primary',     x: 0, y: 0, alive: true, phase: 'idle' },
    s1:      { label: 'Secondary 1', x: 0, y: 0, alive: true, phase: 'idle' },
    s2:      { label: 'Secondary 2', x: 0, y: 0, alive: true, phase: 'idle' },
  },
  client: { x: 0, y: 0 },
  particles: [],
};

// ═══════════════════════════════════════════
// STEP ENGINE
// ═══════════════════════════════════════════
const engine = {
  mode: 'step',          // 'auto' | 'step'
  steps: [],
  idx: -1,               // current step index (-1 = not started)
  _waitResolve: null,    // resolves when user clicks Next in step mode
  busy: false,           // true while a step's animation is running
  done: false,
};

function setMode(m) {
  engine.mode = m;
  document.getElementById('btn-mode-auto').classList.toggle('active', m === 'auto');
  document.getElementById('btn-mode-step').classList.toggle('active', m === 'step');
  syncButtons();
}

function syncButtons() {
  const { mode, idx, steps, busy, done } = engine;
  const btnAction = document.getElementById('btn-action');
  const btnNext   = document.getElementById('btn-next');

  if (mode === 'auto') {
    btnAction.textContent = 'Send Write';
    btnAction.disabled = busy;
    btnNext.style.display = 'none';
  } else {
    btnNext.style.display = '';
    if (done) {
      btnAction.textContent = 'New Write';
      btnAction.disabled = false;
      btnNext.disabled = true;
    } else if (idx === -1) {
      btnAction.textContent = 'Start Write';
      btnAction.disabled = false;
      btnNext.disabled = true;
    } else {
      btnAction.textContent = 'Start Write';
      btnAction.disabled = true;
      // Next enabled only when not busy and more steps exist
      btnNext.disabled = busy || idx >= steps.length - 1 && !engine._waitResolve;
      // Actually: Next enabled when waiting for click
      btnNext.disabled = busy || engine._waitResolve === null;
    }
  }
}

function advanceStep() {
  if (engine._waitResolve) {
    const r = engine._waitResolve;
    engine._waitResolve = null;
    r();
  }
}

async function waitForClick() {
  if (engine.mode === 'auto') return;
  return new Promise(resolve => {
    engine._waitResolve = resolve;
    syncButtons();
  });
}

function showStepPanel(idx) {
  const panel = document.getElementById('step-panel');
  if (idx < 0 || engine.steps.length === 0) { panel.classList.add('hidden'); return; }

  panel.classList.remove('hidden');
  const step = engine.steps[idx];
  document.getElementById('step-badge').textContent = `Step ${idx + 1} of ${engine.steps.length}`;
  document.getElementById('step-title').textContent = step.title;
  document.getElementById('step-explain').innerHTML = step.explain;

  // dots
  const dotsEl = document.getElementById('step-dots');
  dotsEl.innerHTML = '';
  engine.steps.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i < idx ? ' done' : i === idx ? ' current' : '');
    dotsEl.appendChild(d);
  });
}

async function runEngine(steps) {
  engine.steps = steps;
  engine.idx = -1;
  engine.done = false;
  engine.busy = false;

  for (let i = 0; i < steps.length; i++) {
    engine.idx = i;
    showStepPanel(i);
    syncButtons();

    await waitForClick(); // no-op in auto mode

    engine.busy = true;
    syncButtons();
    log(`▶ ${steps[i].title}`, 'info');
    await steps[i].run();
    engine.busy = false;

    if (engine.mode === 'auto' && i < steps.length - 1) await delay(AUTO_STEP_MS);
  }

  engine.done = true;
  engine.idx = steps.length;
  showStepPanel(steps.length - 1); // keep last step visible
  syncButtons();
}

// ═══════════════════════════════════════════
// CONCERN LOGIC
// ═══════════════════════════════════════════
function resolveW(raw) {
  return raw === 'majority' ? 'majority' : parseInt(raw, 10);
}

function requiredAckers(w) {
  const alive = ['primary', 's1', 's2'].filter(k => state.nodes[k].alive);
  if (w === 0) return [];
  if (w === 1) return alive.slice(0, 1);
  if (w === 'majority') return alive.slice(0, 2);
  return alive.slice(0, Math.min(w, alive.length));
}

function canAchieve(w) {
  if (w === 0) return true;
  const need = w === 'majority' ? 2 : w;
  return Object.values(state.nodes).filter(n => n.alive).length >= need;
}

// ═══════════════════════════════════════════
// FAILURE
// ═══════════════════════════════════════════
function applyFailure(f) {
  Object.values(state.nodes).forEach(n => { n.alive = true; n.phase = 'idle'; });
  if (f === 's1down')   state.nodes.s1.alive = false;
  if (f === 's2down')   state.nodes.s2.alive = false;
  if (f === 'bothdown') { state.nodes.s1.alive = false; state.nodes.s2.alive = false; }
  if (f === 'pdown')    state.nodes.primary.alive = false;
  if (f === 'partition'){ state.nodes.s1.alive = false; state.nodes.s2.alive = false; }
}

// ═══════════════════════════════════════════
// SIMULATION — build step list
// ═══════════════════════════════════════════
function buildWriteSteps(w, j, wtimeout, failure) {
  const achievable    = canAchieve(w);
  const ackers        = requiredAckers(w);
  const aliveSecs     = ['s1', 's2'].filter(k => state.nodes[k].alive);
  const secAckers     = ackers.filter(k => k !== 'primary');
  const aliveCount    = Object.values(state.nodes).filter(n => n.alive).length;
  const needCount     = w === 'majority' ? 2 : w === 0 ? 0 : w;

  const steps = [];

  // ── 1. Issue write ──────────────────────────────────────
  steps.push({
    title: 'Client sends write to Primary',
    explain: `The write client dispatches the operation to the replica set primary. <strong>All writes in MongoDB go to the primary</strong> — secondaries are read-only replicas. ` +
             `The client has configured <strong>w:${w}${j ? ', j:true' : ''}</strong>, which controls when it gets an acknowledgment back.`,
    run: () => awaitParticle(state.client, state.nodes.primary, '#F5A623', 'write', () => {
      state.nodes.primary.phase = 'active';
      log('Write received by primary.', 'info');
    }),
  });

  // ── 2. No primary → fail immediately ───────────────────
  if (!state.nodes.primary.alive) {
    steps.push({
      title: 'No primary available',
      explain: `The primary is down. MongoDB requires a primary to accept writes. With only ${aliveCount} node(s) reachable, no election can succeed (need majority = 2 votes). <strong>The write fails immediately with a "no primary" error.</strong>`,
      run: async () => {
        log('Write failed — no primary available.', 'err');
        draw();
      },
    });
    return steps;
  }

  // ── 3. Applied in-memory on primary ────────────────────
  steps.push({
    title: `Write applied on Primary${j ? ' + journal flush' : ' (in-memory)'}`,
    explain: j
      ? `The primary applies the write to its <strong>WiredTiger in-memory cache</strong> and appends to its oplog. Because <strong>j:true</strong>, it must flush the oplog entry to the <strong>on-disk journal</strong> before counting this node's acknowledgment. This makes the primary's copy crash-safe even before replication.`
      : `The primary applies the write to its <strong>WiredTiger in-memory cache</strong> and appends to its oplog. With <strong>j:false</strong> (default), no journal flush is required — the write lives in memory and in the OS page cache. It survives normal operation but could be lost on an unclean shutdown of this node.`,
    run: async () => {
      if (j) {
        await delay(500);
        log('Primary: journal flush complete.', 'info');
      }
      state.nodes.primary.phase = w === 0 ? 'acked' : 'active';
      draw();
    },
  });

  // ── 4. w:0 fast-path ───────────────────────────────────
  if (w === 0) {
    steps.push({
      title: 'No acknowledgment requested (w:0)',
      explain: `<strong>w:0 is fire-and-forget.</strong> MongoDB does not send an acknowledgment back to the client. The write may succeed, fail, or be rolled back — the client will never know. The primary applies the write and async replication proceeds normally. Use only for non-critical data where absolute maximum throughput matters.`,
      run: async () => {
        aliveSecs.forEach(k => {
          setTimeout(() => {
            awaitParticle(state.nodes.primary, state.nodes[k], '#4A90D9', 'oplog', () => {
              state.nodes[k].phase = 'active';
            });
          }, Math.random() * 200);
        });
        startAnimLoop();
        await delay(400);
        log('w:0 — no ACK sent to client. Async replication proceeds.', 'warn');
      },
    });
    return steps;
  }

  // ── 5. Replication ─────────────────────────────────────
  if (aliveSecs.length > 0) {
    steps.push({
      title: 'Oplog entries replicate to Secondaries',
      explain: `The secondaries continuously tail the primary's <strong>oplog</strong> and pull new entries. This replication is <strong>always asynchronous and always happens</strong> — it is independent of the write concern. Write concern only controls whether the primary <em>waits</em> for secondary acknowledgments before responding to the client.` +
        (secAckers.length > 0
          ? ` With <strong>w:${w}</strong>, the primary must wait for <strong>${secAckers.length}</strong> secondar${secAckers.length > 1 ? 'ies' : 'y'} to acknowledge.`
          : ` With <strong>w:1</strong>, the primary does <em>not</em> wait for any secondary — replication is purely async here.`),
      run: () => Promise.all(aliveSecs.map(k =>
        awaitParticle(state.nodes.primary, state.nodes[k], '#4A90D9', 'oplog', () => {
          state.nodes[k].phase = 'active';
          log(`${state.nodes[k].label}: oplog entry received.`, 'info');
        })
      )),
    });
  }

  // ── 6. Secondary acks ──────────────────────────────────
  if (secAckers.length > 0 && achievable) {
    steps.push({
      title: `Secondar${secAckers.length > 1 ? 'ies' : 'y'} acknowledge${secAckers.length > 1 ? '' : 's'}`,
      explain: `The primary is waiting for ${secAckers.length} secondar${secAckers.length > 1 ? 'ies' : 'y'} to confirm the write. ` +
        (j
          ? `Because <strong>j:true</strong>, each secondary must also <strong>flush to its journal</strong> before sending its acknowledgment. This ensures the write is crash-durable on a majority of nodes.`
          : `Because <strong>j:false</strong>, the secondary acknowledges after applying the write <strong>in-memory</strong>. It's faster but doesn't guarantee the secondary's copy survives a crash.`) +
        ` Once the primary has collected enough acks, it can respond to the client.`,
      run: async () => {
        await delay(j ? 500 : 250);
        secAckers.forEach(k => {
          state.nodes[k].phase = 'acked';
          log(`${state.nodes[k].label}: acked (${j ? 'journaled' : 'in-memory'}).`, 'ok');
        });
        draw();
      },
    });
  }

  // ── 7. Outcome ─────────────────────────────────────────
  if (!achievable) {
    steps.push({
      title: 'Write concern cannot be satisfied',
      explain: `<strong>w:${w}</strong> requires ${needCount} node(s) to acknowledge, but only ${aliveCount} node(s) are reachable. ` +
        (wtimeout > 0
          ? `After <strong>${wtimeout}ms (wtimeout)</strong>, MongoDB returns a write concern error to the client. `
          : `With <strong>wtimeout:0</strong>, the primary would block <em>indefinitely</em>. Always set wtimeout to avoid hung operations. `) +
        `<strong>Critical:</strong> the write IS already applied on the primary — it is <em>not</em> rolled back. It will eventually replicate, or roll back only if the primary fails before majority replication occurs.`,
      run: async () => {
        if (wtimeout > 0) await delay(Math.min(wtimeout, 1200));
        state.nodes.primary.phase = 'error';
        await awaitParticle(state.nodes.primary, state.client, '#FF6B6B', 'ERR', () => {});
        log(`Write concern error — w:${w} unachievable. Data on primary, durability unconfirmed.`, 'err');
      },
    });
  } else {
    steps.push({
      title: 'ACK returned to client',
      explain: `The primary has received all required acknowledgments for <strong>w:${w}${j ? ', j:true' : ''}</strong>. It sends a success acknowledgment to the client. ` +
        (w === 'majority' && j
          ? `<strong>This write is fully durable.</strong> It is persisted on disk on a majority of nodes and will survive a simultaneous crash of any minority of nodes.`
          : w === 'majority'
          ? `The write is on a majority of nodes in memory. It will survive primary failover, but <strong>j:false means it could be lost if the majority crashes before the next journal flush</strong>.`
          : `The write is acknowledged by ${ackers.length} node(s). If the primary steps down before replicating further, <strong>this write may be rolled back</strong>.`),
      run: async () => {
        state.nodes.primary.phase = 'acked';
        await awaitParticle(state.nodes.primary, state.client, '#00ED64', 'ACK', () => {});
        log(`ACK — w:${w}${j ? ', j:true' : ''} satisfied.`, 'ok');
      },
    });
  }

  return steps;
}

// ═══════════════════════════════════════════
// MAIN ACTION
// ═══════════════════════════════════════════
async function handleAction() {
  if (engine.done || engine.idx === -1) {
    // Reset and start fresh
    resetVisual();
    const w       = resolveW(document.getElementById('sel-w').value);
    const j       = document.getElementById('sel-j').value === 'true';
    const wt      = parseInt(document.getElementById('inp-wtimeout').value) || 0;
    const failure = document.getElementById('sel-failure').value;

    applyFailure(failure);
    log(`─── Write: w:${w}, j:${j}, wtimeout:${wt}, failure:${failure} ───`, 'info');
    draw();

    const steps = buildWriteSteps(w, j, wt, failure);
    runEngine(steps); // no await — runs in background, engine state drives UI
  }
}

function resetVisual() {
  state.particles = [];
  Object.values(state.nodes).forEach(n => { n.phase = 'idle'; });
  document.getElementById('step-panel').classList.add('hidden');
  engine.done = false;
  engine.idx = -1;
  engine._waitResolve = null;
  engine.busy = false;
  engine.steps = [];
}

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════
function awaitParticle(from, to, color, label, onArrive) {
  return new Promise(resolve => {
    state.particles.push({
      sx: from.x, sy: from.y,
      tx: to.x,   ty: to.y,
      x: from.x,  y: from.y,
      progress: 0, color, label,
      onArrive: () => { if (onArrive) onArrive(); resolve(); },
    });
    startAnimLoop();
  });
}

function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

let animRunning = false, lastT = null;
function startAnimLoop() {
  if (animRunning) return;
  animRunning = true;
  lastT = null;
  requestAnimationFrame(function loop(ts) {
    if (!lastT) lastT = ts;
    const dt = Math.min(ts - lastT, 50);
    lastT = ts;

    state.particles.forEach(p => {
      p.progress = Math.min(1, p.progress + dt / PARTICLE_MS);
      p.x = p.sx + (p.tx - p.sx) * ease(p.progress);
      p.y = p.sy + (p.ty - p.sy) * ease(p.progress);
    });

    // fire arrivals
    state.particles.filter(p => p.progress >= 1 && p.onArrive).forEach(p => {
      p.onArrive(); p.onArrive = null;
    });
    state.particles = state.particles.filter(p => p.progress < 1);

    draw();

    if (state.particles.length > 0) requestAnimationFrame(loop);
    else { animRunning = false; draw(); }
  });
}

// ═══════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════
function computeLayout(W, H) {
  const cx = W / 2;
  state.client.x = cx;
  state.client.y = 64;

  const nodeY = H - 100;
  state.nodes.primary.x = cx;       state.nodes.primary.y = nodeY;
  state.nodes.s1.x      = cx - 210; state.nodes.s1.y      = nodeY;
  state.nodes.s2.x      = cx + 210; state.nodes.s2.y      = nodeY;
}

// ═══════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const NR = 40, CR = 28; // node radius, client radius

function resizeCanvas() {
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeLayout(rect.width, rect.height);
  draw();
}

function draw() {
  const W = canvas.getBoundingClientRect().width;
  const H = canvas.getBoundingClientRect().height;
  ctx.clearRect(0, 0, W, H);
  drawRSBox();
  drawReplicationLinks();
  drawClientLine();
  drawNode(state.nodes.s1,      'secondary');
  drawNode(state.nodes.s2,      'secondary');
  drawNode(state.nodes.primary, 'primary');
  drawClient();
  drawParticles();
}

function drawRSBox() {
  const pad = 34;
  const xs  = [state.nodes.s1.x, state.nodes.primary.x, state.nodes.s2.x];
  const bx  = Math.min(...xs) - NR - pad;
  const bw  = Math.max(...xs) + NR + pad - bx;
  const by  = state.nodes.primary.y - NR - 22;
  const bh  = NR * 2 + 52;
  ctx.save();
  ctx.strokeStyle = '#26384A'; ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.stroke();
  ctx.setLineDash([]);
  // RS icon + label
  const iconSize = 14, iconX = bx + 12 + iconSize / 2, iconY = by + 8 + iconSize / 2;
  drawIcon(ICON_RS, iconX, iconY, iconSize, '#3D5A70');
  ctx.fillStyle = '#3D5A70'; ctx.font = '11px system-ui'; ctx.textAlign = 'left';
  ctx.fillText('Replica Set  ·  3-node P-S-S  ·  majority = 2', bx + 12 + iconSize + 6, by + 16);
  ctx.restore();
}

function drawReplicationLinks() {
  const p = state.nodes.primary;
  ['s1', 's2'].forEach(k => {
    const s = state.nodes[k];
    ctx.save();
    ctx.strokeStyle = s.alive ? '#2A4055' : '#1E2A35';
    ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  });
}

function drawClientLine() {
  const p = state.nodes.primary;
  ctx.save();
  ctx.strokeStyle = '#2A4055'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(state.client.x, state.client.y + CR);
  ctx.lineTo(p.x, p.y - NR);
  ctx.stroke();
  ctx.restore();
}

const PHASE_FILL   = { idle: '#182535', active: '#0D2820', acked: '#0A2010', error: '#2A0E0E' };
const PHASE_STROKE = { idle: null,      active: '#00ED64', acked: '#00ED64', error: '#FF6B6B' };

function drawNode(node, role) {
  ctx.save();
  if (!node.alive) ctx.globalAlpha = 0.25;

  const defaultStroke = role === 'primary' ? '#C87A10' : '#3A70A0';
  const stroke = PHASE_STROKE[node.phase] || defaultStroke;

  // circle background
  ctx.beginPath(); ctx.arc(node.x, node.y, NR, 0, Math.PI*2);
  ctx.fillStyle = PHASE_FILL[node.phase] || PHASE_FILL.idle; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = node.phase !== 'idle' ? 2.5 : 1.5; ctx.stroke();

  // MongoDB leaf — color reflects state
  const iconColor =
    !node.alive             ? '#2A3D50' :
    node.phase === 'acked'  ? '#00ED64' :
    node.phase === 'active' ? '#4DCC90' :
    node.phase === 'error'  ? '#FF6B6B' :
    role === 'primary'      ? '#C87A10' : '#4A90D9';
  drawIcon(ICON_LEAF, node.x, node.y - 8, 30, iconColor, 24);

  // label below icon
  ctx.fillStyle = '#D8E8F3'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(node.label, node.x, node.y + 20);

  // phase badge
  const badge = node.alive ? node.phase : 'DOWN';
  ctx.fillStyle = !node.alive ? '#FF6B6B' : node.phase === 'acked' ? '#00ED64' : node.phase === 'error' ? '#FF6B6B' : '#3D5570';
  ctx.font = '9px system-ui';
  ctx.fillText(badge, node.x, node.y + 31);

  ctx.restore();
}

function drawClient() {
  const c = state.client;
  ctx.save();
  ctx.beginPath(); ctx.arc(c.x, c.y, CR, 0, Math.PI*2);
  ctx.fillStyle = '#0F2535'; ctx.fill();
  ctx.strokeStyle = '#7EC8E3'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#D8E8F3'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('Write', c.x, c.y - 3);
  ctx.fillText('Client', c.x, c.y + 10);
  ctx.restore();
}

function drawParticles() {
  state.particles.forEach(p => {
    if (p.x == null) return;
    ctx.save();
    // trail
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
    ctx.fillStyle = p.color + '30'; ctx.fill();
    // dot
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
    if (p.label) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(p.label, p.x, p.y - 12);
    }
    ctx.restore();
  });
}

// ═══════════════════════════════════════════
// LOG
// ═══════════════════════════════════════════
const logEl = document.getElementById('log');
function log(msg, cls = 'info') {
  const el = document.createElement('div');
  el.className = cls;
  el.textContent = `[${new Date().toLocaleTimeString()}]  ${msg}`;
  logEl.prepend(el);
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════
document.getElementById('sel-failure').addEventListener('change', e => {
  applyFailure(e.target.value);
  resetVisual();
  draw();
});

['sel-w','sel-j','inp-wtimeout'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { resetVisual(); draw(); });
});

window.addEventListener('resize', resizeCanvas);

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
setMode('step');
resizeCanvas();
syncButtons();
log('Ready — configure write concern above and click Start Write.', 'info');
</script>
