<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MongoDB Read/Write Concerns Playground</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0F1923; color: #D8E8F3;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px 16px 56px; gap: 12px;
    }
    header { text-align: center; }
    h1 { font-size: 1.55rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .subtitle { margin-top: 4px; font-size: 0.84rem; color: #90AEBF; }

    .card {
      background: #182535; border: 1px solid #26384A; border-radius: 12px;
    }

    /* ── Top bar: failure + reset ── */
    .top-bar {
      width: 100%; max-width: 1200px;
      display: flex; align-items: flex-end; gap: 14px;
      padding: 10px 16px; flex-wrap: wrap;
    }
    .top-bar .cg { flex: 1; min-width: 180px; }

    /* ── Form elements ── */
    .cg { display: flex; flex-direction: column; gap: 4px; }
    .cg label { font-size: 0.72rem; color: #90AEBF; text-transform: uppercase; letter-spacing: 0.05em; }

    select, input[type=number] {
      background: #0A1E2B; border: 1px solid #26384A; color: #D8E8F3;
      border-radius: 7px; padding: 6px 9px; font-size: 0.82rem; cursor: pointer;
    }
    select:focus, input[type=number]:focus { outline: 2px solid #00ED64; border-color: transparent; }

    .btn-group { display: flex; gap: 5px; }
    button {
      background: #00ED64; color: #0F1923; border: none;
      border-radius: 8px; padding: 7px 14px; font-size: 0.84rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    button:hover { background: #00c050; }
    button:disabled { background: #26384A; color: #5a7a8a; cursor: not-allowed; }
    button.sec { background: #1A2E40; color: #D8E8F3; border: 1px solid #26384A; }
    button.sec:hover { background: #26384A; }
    button.sec.on { background: #0A2535; border-color: #00ED64; color: #00ED64; }
    button.read-btn { background: #7EC8E3; color: #0F1923; }
    button.read-btn:hover { background: #5ab8d8; }
    button.sec.rmode-on { background: #0A2030; border-color: #7EC8E3; color: #7EC8E3; }

    /* ── Three-column viz row ── */
    .viz-row {
      display: flex; gap: 12px;
      width: 100%; max-width: 1200px;
      align-items: stretch;
    }

    /* ── Side panels ── */
    .side-panel {
      width: 195px; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 10px;
      padding: 14px;
    }
    .side-panel select, .side-panel input[type=number] { width: 100%; }

    .side-header {
      font-size: 0.75rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding-bottom: 6px; margin-bottom: 2px;
    }
    .write-side .side-header { color: #F5A623; border-bottom: 2px solid #F5A62340; }
    .read-side  .side-header { color: #7EC8E3; border-bottom: 2px solid #7EC8E340; }

    .side-controls { display: flex; flex-direction: column; gap: 8px; }
    .side-actions  { display: flex; gap: 5px; flex-wrap: wrap; }
    .side-actions button { flex: 1; min-width: 70px; text-align: center; }

    /* ── Consistency boxes ── */
    .consistency-box {
      margin-top: auto; padding: 10px 11px;
      border-radius: 8px; background: #0D1F30;
      border: 1px solid #1E3346; min-height: 55px;
    }
    .cb-dim { color: #3D5570; font-size: 0.78rem; }
    .cb-label { font-size: 0.7rem; color: #90AEBF; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 3px; }
    .cb-status { font-size: 0.88rem; font-weight: 700; margin-bottom: 3px; }
    .cb-ok   { color: #00ED64; }
    .cb-warn { color: #F5A623; }
    .cb-error { color: #FF6B6B; }
    .cb-detail { font-size: 0.73rem; color: #6A8A9F; line-height: 1.45; }

    /* ── Stage ── */
    .stage { flex: 1; min-width: 0; padding: 14px; }
    #canvas { display: block; width: 100%; height: 560px; }

    /* ── Step panels ── */
    .step-card { width: 100%; max-width: 1200px; }
    .step-panels { display: flex; }
    .step-panel { flex: 1; padding: 13px 16px 15px; }
    .step-panel.hidden { display: none; }
    .step-panel + .step-panel { border-left: 1px solid #26384A; }
    .write-step-panel { border-top: 2px solid #F5A623; }
    .read-step-panel  { border-top: 2px solid #7EC8E3; }
    .step-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
    .step-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
    .write-label { background: #F5A623; color: #0F1923; }
    .read-label  { background: #7EC8E3; color: #0F1923; }
    .step-badge { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #90AEBF; }
    .step-dots { display: flex; gap: 5px; }
    .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #26384A; transition: background .2s; }
    .step-dot.done    { background: #00ED64; }
    .step-dot.current { background: #F5A623; }
    .step-title { font-size: 0.97rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .step-explain { font-size: 0.83rem; color: #90AEBF; line-height: 1.6; }
    .step-explain strong { color: #D8E8F3; }

    /* ── Log ── */
    .log-card { width: 100%; max-width: 1200px; }
    .log-panel { padding: 11px 16px; }
    .log-panel h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .06em; color: #90AEBF; margin-bottom: 7px; }
    #log { font-family: 'SF Mono','Fira Code',monospace; font-size: 0.77rem; line-height: 1.65; color: #90AEBF; min-height: 44px; max-height: 120px; overflow-y: auto; }
    #log .ok   { color: #00ED64; }
    #log .warn { color: #F5A623; }
    #log .err  { color: #FF6B6B; }
    #log .info { color: #7EC8E3; }

    /* ── Responsive: stack on narrow screens ── */
    @media (max-width: 860px) {
      .viz-row { flex-direction: column; }
      .side-panel { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 10px; }
      .side-controls { flex: 1; flex-direction: row; flex-wrap: wrap; gap: 8px; }
      .side-controls .cg { min-width: 130px; }
      .consistency-box { margin-top: 0; min-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>MongoDB Concerns Playground</h1>
  <p class="subtitle">Visualise how read &amp; write concerns shape data flow in a 3-node replica set</p>
</header>

<!-- Failure scenario + Reset -->
<div class="card top-bar">
  <div class="cg">
    <label>Simulate failure</label>
    <select id="sel-failure">
      <option value="none">None — all nodes healthy</option>
      <option value="s1down">Secondary 1 down</option>
      <option value="s2down">Secondary 2 down</option>
      <option value="bothdown">Both secondaries down</option>
      <option value="pdown">Primary down</option>
      <option value="partition">Network partition (P isolated)</option>
    </select>
  </div>
  <button class="sec" id="btn-reset" onclick="resetScenario()">Reset ↺</button>
</div>

<!-- ═══ Three-column visualization area ═══ -->
<div class="viz-row">

  <!-- Left: Write Client controls -->
  <div class="card side-panel write-side">
    <div class="side-header">Write Client</div>
    <div class="side-controls">
      <div class="cg">
        <label>Write concern (w)</label>
        <select id="sel-w">
          <option value="0">0 — fire &amp; forget</option>
          <option value="1">1 — primary only</option>
          <option value="2">2 — primary + 1 sec</option>
          <option value="3">3 — all nodes</option>
          <option value="majority" selected>majority</option>
        </select>
      </div>
      <div class="cg">
        <label>Journal (j)</label>
        <select id="sel-j">
          <option value="false" selected>false</option>
          <option value="true">true</option>
        </select>
      </div>
      <div class="cg">
        <label>wtimeout (ms)</label>
        <input id="inp-wtimeout" type="number" value="0" min="0" step="500" />
      </div>
    </div>
    <div class="side-actions">
      <button id="btn-write-start" onclick="handleWrite()">Start Write</button>
      <button class="sec" id="btn-write-next" onclick="advanceWriteStep()" disabled>Next →</button>
      <button class="sec" id="btn-write-finish" onclick="autoFinishWrite()" disabled>Finish ▶▶</button>
    </div>
    <div class="consistency-box" id="writer-consistency">
      <div class="cb-dim">No writes issued</div>
    </div>
  </div>

  <!-- Center: Canvas -->
  <div class="card stage">
    <canvas id="canvas"></canvas>
  </div>

  <!-- Right: Read Client controls -->
  <div class="card side-panel read-side">
    <div class="side-header">Read Client</div>
    <div class="side-controls">
      <div class="cg">
        <label>Read concern</label>
        <select id="sel-rc">
          <option value="local">local</option>
          <option value="available">available</option>
          <option value="majority" selected>majority</option>
          <option value="snapshot">snapshot</option>
          <option value="linearizable">linearizable</option>
        </select>
      </div>
      <div class="cg">
        <label>Read preference</label>
        <select id="sel-readpref">
          <option value="primary" selected>primary</option>
          <option value="primaryPreferred">primaryPreferred</option>
          <option value="secondary">secondary</option>
          <option value="secondaryPreferred">secondaryPreferred</option>
        </select>
      </div>
      <div class="cg">
        <label>Read mode</label>
        <div class="btn-group">
          <button class="sec rmode-on" id="btn-rmode-auto" onclick="setReadMode('auto')">Auto</button>
          <button class="sec" id="btn-rmode-step" onclick="setReadMode('step')">Step</button>
        </div>
      </div>
    </div>
    <div class="side-actions">
      <button class="read-btn" id="btn-read-start" onclick="handleRead()">Probe Read</button>
      <button class="sec" id="btn-read-next" onclick="advanceReadStep()" disabled style="display:none">Next →</button>
    </div>
    <div class="consistency-box" id="reader-consistency">
      <div class="cb-dim">No reads completed</div>
    </div>
  </div>

</div><!-- /viz-row -->

<!-- Step panels -->
<div class="card step-card">
  <div class="step-panels">
    <div class="step-panel write-step-panel hidden" id="write-step-panel">
      <div class="step-meta">
        <span class="step-label write-label">WRITE</span>
        <span class="step-badge" id="write-step-badge">Step 1 of 5</span>
        <div class="step-dots" id="write-step-dots"></div>
      </div>
      <div class="step-title"  id="write-step-title"></div>
      <div class="step-explain" id="write-step-explain"></div>
    </div>
    <div class="step-panel read-step-panel hidden" id="read-step-panel">
      <div class="step-meta">
        <span class="step-label read-label">READ</span>
        <span class="step-badge" id="read-step-badge">Step 1 of 3</span>
        <div class="step-dots" id="read-step-dots"></div>
      </div>
      <div class="step-title"  id="read-step-title"></div>
      <div class="step-explain" id="read-step-explain"></div>
    </div>
  </div>
</div>

<div class="card log-card log-panel">
  <h2>Event log</h2>
  <div id="log"></div>
</div>

<script src="js/state.js"></script>
<script src="js/icons.js"></script>
<script src="js/engine.js"></script>
<script src="js/draw.js"></script>
<script src="js/simulation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
